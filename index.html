<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 几何画板</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c5c56'/%3E%3Cpath d='M16 7 25 23H7Z' fill='none' stroke='%23f7f4ee' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='18.5' r='3' fill='none' stroke='%23f7f4ee' stroke-width='2.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/board.css" />
</head>
<body data-page="workspace">
<div class="app-shell">

  <!-- 全局顶部导航 -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f7f4ee" stroke-width="2" stroke-linejoin="round">
          <path d="M12 3.5 20 19H4z" />
          <circle cx="12" cy="15" r="2.6" />
        </svg>
      </span>
      <span>AI 几何画板</span>
    </a>
    <nav class="topnav" aria-label="全局导航">
      <a href="index.html" class="active">工作区</a>
      <a href="dashboard.html">工作台</a>
      <a href="settings.html">设置</a>
    </nav>
    <div class="topbar-right" data-topbar-right></div>
  </header>

  <!-- 模式头部:标题 / 简介 / 模型状态 / 模式切换 -->
  <header class="mode-head">
    <div>
      <p class="eyebrow" id="mode-eyebrow">几何</p>
      <h1 id="mode-title">AI 几何画板</h1>
    </div>
    <p class="lede" id="mode-lede"></p>
    <div class="meta">
      <span class="dot dot-ok" title="已连接"></span>
      <span>当前模型</span>
      <button type="button" class="model-btn" id="model-btn" title="当前模型(模拟 GET /api/status)"></button>
      <div class="user-menu">
        <div class="menu" id="model-menu" style="display:none"></div>
      </div>
    </div>
    <nav class="modes" id="mode-nav" aria-label="计算器模式">
      <button type="button" data-mode="geometry" class="active" aria-pressed="true">几何</button>
      <button type="button" data-mode="3d" aria-pressed="false">3D</button>
      <button type="button" data-mode="probability" aria-pressed="false">概率</button>
      <button type="button" data-mode="scientific" aria-pressed="false">科学</button>
    </nav>
  </header>

  <main class="workspace">
    <!-- 左侧:会话区 -->
    <section class="conversation">
      <div class="examples" id="examples"></div>
      <div class="transcript" id="transcript"></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-input" rows="3" placeholder=""></textarea>
        <div class="actions">
          <button type="button" class="ghost" id="clear-btn">清空</button>
          <button type="submit" class="submit" id="submit-btn">作图</button>
        </div>
        <div class="hint-row">
          <span><kbd>Enter</kbd> 提交</span>
          <span><kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
          <span><kbd>Esc</kbd> 停止</span>
          <span>会话按模式分开保存</span>
        </div>
      </form>
    </section>

    <!-- 右侧:画板区 -->
    <section class="stage">
      <div class="stage-tools" id="stage-tools">
        <button type="button" id="axes-btn">显示坐标系</button>
        <button type="button" id="angle-btn" style="display:none">角度</button>
        <button type="button" id="log-btn" class="active">隐藏命令</button>
      </div>
      <div class="board-frame">
        <div class="board-host" id="board"></div>
      </div>
      <div class="log" id="log">
        <div class="log-head">
          <h2 id="log-title">命令</h2>
          <span id="log-retry" class="retry-badge" style="display:none">已自动修改并重新执行</span>
          <span id="log-count"></span>
        </div>
        <p class="empty" id="log-empty">命令执行后会显示在这里。</p>
        <ol id="log-list"></ol>
      </div>
    </section>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/board.js"></script>
<script src="js/app.js"></script>
</body>
</html>
