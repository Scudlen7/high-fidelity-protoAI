<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 · AI 几何画板</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c5c56'/%3E%3Cpath d='M16 7 25 23H7Z' fill='none' stroke='%23f7f4ee' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='18.5' r='3' fill='none' stroke='%23f7f4ee' stroke-width='2.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page" data-auth-page="register">
<div class="auth-wrap">

  <!-- 品牌区 -->
  <aside class="auth-brand">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0c5c56" stroke-width="2" stroke-linejoin="round">
          <path d="M12 3.5 20 19H4z" />
          <circle cx="12" cy="15" r="2.6" />
        </svg>
      </span>
      <span>AI 几何画板</span>
    </a>
    <div class="auth-decor" aria-hidden="true">
      <svg viewBox="0 0 460 900" preserveAspectRatio="xMidYMid slice" fill="none">
        <g stroke="#ffffff" opacity="0.1">
          <path d="M0 80h460M0 160h460M0 240h460M0 320h460M0 400h460M0 480h460M0 560h460M0 640h460M0 720h460M0 800h460"/>
          <path d="M80 0v900M160 0v900M240 0v900M320 0v900M400 0v900"/>
        </g>
        <g stroke="#ffffff" stroke-width="1.6">
          <circle cx="230" cy="310" r="118" opacity="0.55" />
          <path d="M156 424 304 424 230 190z" opacity="0.75" stroke-linejoin="round" />
          <circle cx="230" cy="338" r="52" opacity="0.55" />
        </g>
        <g fill="#ffffff">
          <circle cx="230" cy="190" r="4" />
          <circle cx="156" cy="424" r="4" />
          <circle cx="304" cy="424" r="4" />
          <circle cx="230" cy="310" r="4" />
        </g>
      </svg>
    </div>
    <div class="auth-copy">
      <h2>注册一个账号,把你的作图带到任何设备</h2>
      <p class="lede-line">免费注册。会话、偏好与历史作品都会同步到云端,换设备也能接着画。</p>
      <ul class="auth-features">
        <li>
          <span class="f-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3 21 19H3z"/><circle cx="12" cy="15" r="2.5"/></svg>
          </span>
          <span><b>四种计算器</b>&nbsp;自然语言驱动作图与计算</span>
        </li>
        <li>
          <span class="f-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span><b>自动纠错</b>&nbsp;失败命令自动诊断并重新执行</span>
        </li>
        <li>
          <span class="f-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg>
          </span>
          <span><b>云端同步</b>&nbsp;会话随账号保存,多设备继续作图</span>
        </li>
      </ul>
    </div>
    <p class="auth-foot">© 2026 AI 几何画板 · 高保真原型</p>
  </aside>

  <!-- 注册表单区 -->
  <main class="auth-form-side">
    <div class="auth-card">
      <div class="a-head">
        <h1>创建账号</h1>
        <p class="a-sub">几步完成注册,立即开始 AI 作图。</p>
      </div>

      <form class="auth-form" id="register-form" novalidate>
        <div class="field">
          <label for="reg-name">昵称</label>
          <input type="text" id="reg-name" placeholder="怎么称呼你?" autocomplete="name" />
          <p class="error-msg">昵称至少 2 个字符</p>
        </div>
        <div class="field">
          <label for="reg-email">邮箱</label>
          <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="username" />
          <p class="error-msg">请输入正确的邮箱地址</p>
        </div>
        <div class="field">
          <label for="reg-code">邮箱验证码</label>
          <div class="code-row">
            <input type="text" id="reg-code" placeholder="4 位数字" maxlength="4" inputmode="numeric" />
            <button type="button" class="btn btn-ghost btn-sm send-code" id="send-code">发送验证码</button>
          </div>
          <p class="error-msg">请输入 4 位验证码</p>
        </div>
        <div class="field">
          <label for="reg-password">密码</label>
          <input type="password" id="reg-password" placeholder="至少 8 位,含字母和数字" autocomplete="new-password" />
          <p class="error-msg">至少 8 位,且需同时包含字母和数字</p>
        </div>
        <div class="field">
          <label for="reg-confirm">确认密码</label>
          <input type="password" id="reg-confirm" placeholder="再输入一次密码" autocomplete="new-password" />
          <p class="error-msg">两次输入的密码不一致</p>
        </div>
        <label class="check-line">
          <input type="checkbox" id="reg-agree" />
          <span>我已阅读并同意<a href="javascript:void(0)" data-agree>《用户协议》</a>与<a href="javascript:void(0)" data-agree>《隐私政策》</a></span>
        </label>
        <button type="submit" class="btn btn-lg btn-block auth-submit">注册并登录</button>
      </form>

      <p class="auth-switch">已经有账号?<a href="login.html">直接登录</a></p>
    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
