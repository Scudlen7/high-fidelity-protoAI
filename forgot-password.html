<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>找回密码 · AI 几何画板</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c5c56'/%3E%3Cpath d='M16 7 25 23H7Z' fill='none' stroke='%23f7f4ee' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='18.5' r='3' fill='none' stroke='%23f7f4ee' stroke-width='2.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page" data-auth-page="forgot">
<div class="auth-wrap">

  <!-- 品牌区 -->
  <aside class="auth-brand">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0c5c56" stroke-width="2" stroke-linejoin="round">
          <path d="M12 3.5 20 19H4z" />
          <circle cx="12" cy="15" r="2.6" />
        </svg>
      </span>
      <span>AI 几何画板</span>
    </a>
    <div class="auth-decor" aria-hidden="true">
      <svg viewBox="0 0 460 900" preserveAspectRatio="xMidYMid slice" fill="none">
        <g stroke="#ffffff" opacity="0.1">
          <path d="M0 80h460M0 160h460M0 240h460M0 320h460M0 400h460M0 480h460M0 560h460M0 640h460M0 720h460M0 800h460"/>
          <path d="M80 0v900M160 0v900M240 0v900M320 0v900M400 0v900"/>
        </g>
        <g stroke="#ffffff" stroke-width="1.6">
          <circle cx="230" cy="310" r="118" opacity="0.55" />
          <path d="M156 424 304 424 230 190z" opacity="0.75" stroke-linejoin="round" />
          <circle cx="230" cy="338" r="52" opacity="0.55" />
        </g>
        <g fill="#ffffff">
          <circle cx="230" cy="190" r="4" />
          <circle cx="156" cy="424" r="4" />
          <circle cx="304" cy="424" r="4" />
          <circle cx="230" cy="310" r="4" />
        </g>
      </svg>
    </div>
    <div class="auth-copy">
      <h2>找回密码,重新开始作图</h2>
      <p class="lede-line">通过注册邮箱重置密码。会话数据不会受到影响。</p>
    </div>
    <p class="auth-foot">© 2026 AI 几何画板 · 高保真原型</p>
  </aside>

  <!-- 找回密码表单区 -->
  <main class="auth-form-side">
    <div class="auth-card">
      <div class="a-head">
        <h1>找回密码</h1>
        <p class="a-sub">验证你的邮箱,然后设置新密码。</p>
      </div>

      <!-- 步骤指示器 -->
      <div class="steps-indicator" aria-hidden="true">
        <span class="step" data-step="1">1</span>
        <span class="bar" data-bar="1"></span>
        <span class="step" data-step="2">2</span>
        <span class="bar" data-bar="2"></span>
        <span class="step" data-step="3">3</span>
      </div>

      <!-- 步骤 1:输入邮箱 -->
      <form class="auth-form" id="step-1" novalidate>
        <div class="field">
          <label for="forgot-email">注册邮箱</label>
          <input type="email" id="forgot-email" placeholder="you@example.com" autocomplete="email" />
          <p class="error-msg">请输入正确的邮箱地址</p>
        </div>
        <button type="submit" class="btn btn-lg btn-block auth-submit">发送重置邮件</button>
      </form>

      <!-- 步骤 2:设置新密码 -->
      <div id="step-2" style="display:none">
        <div class="sent-mail">
          <span class="m-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          </span>
          <p>重置邮件已发送至 <code id="sent-to"></code><br />(原型演示:直接在此设置新密码)</p>
        </div>
        <form class="auth-form" id="reset-form" novalidate>
          <div class="field">
            <label for="new-password">新密码</label>
            <input type="password" id="new-password" placeholder="至少 8 位,含字母和数字" autocomplete="new-password" />
            <p class="error-msg">至少 8 位,且需同时包含字母和数字</p>
          </div>
          <div class="field">
            <label for="new-confirm">确认新密码</label>
            <input type="password" id="new-confirm" placeholder="再输入一次" autocomplete="new-password" />
            <p class="error-msg">两次输入的密码不一致</p>
          </div>
          <button type="submit" class="btn btn-lg btn-block auth-submit">重置密码</button>
        </form>
      </div>

      <!-- 步骤 3:完成 -->
      <div id="step-3" style="display:none">
        <div class="sent-mail">
          <span class="m-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <p>密码重置成功!<br />请使用新密码登录。</p>
        </div>
        <a class="btn btn-lg btn-block" href="login.html" style="margin-top:0.4rem">去登录</a>
      </div>

      <p class="auth-switch">想起密码了?<a href="login.html">返回登录</a></p>
    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
